name: Instalador de Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'escritorio/**', '.github/workflows/instalador.yml']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Preparar
        shell: bash
        run: cp index.html escritorio/index.html
      - name: Construir instalador
        working-directory: escritorio
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Instalar-Notas-por-Cedula
          path: escritorio/dist/Instalar-Notas-por-Cedula.exe
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Instalador v1.0.${{ github.run_number }}
          make_latest: true
          files: escritorio/dist/Instalar-Notas-por-Cedula.exe
